<!DOCTYPE html>
<html>

<head>
	<title>Hana's Div List</title>

	<style>
		.flex-container {
			display: flex;
			flex-direction: row;
			background-color: red;
		}

		.flex-container>div {
			background-color: #f1f1f1;
			margin: 10px;
			padding: 20px;
			font-size: 30px;
		}

		/* Responsive layout */
		@media (max-width: 600px) {
			.flex-container {
				flex-direction: column;
				background-color: green;
			}
		}
	</style>
</head>

<body>

	<h1>Hana Tolera builds list with divs</h1>

	<input type="text" id="inputText">

	<div class="flex-container" id="target">
		<div class="divlist">row item 1</div>
		<div class="divlist">row item 2</div>
		<div class="divlist">row item 3</div>
	</div>

	<p>
		Press the buttons to add or remove elements from the container.
	</p>

	<button onclick="makeNewDiv()">Add end</button>
	<button onclick="addFront()">Add front</button>
	<button onclick="removeEveryOther()">Remove</button>
	<button onclick="shuffle()">Shuffle</button>
	<script>
		function makeNewDiv() {
			let element = document.createElement("div");

			let inputValue = document.getElementById("inputText").value;

			element.innerHTML = inputValue;
			element.className = "divlist";

			let container = document.getElementById("target");
			container.appendChild(element);
		}

		function addFront() {
			let element = document.createElement("div");

			let inputValue = document.getElementById("inputText").value;

			element.innerHTML = inputValue;
			element.className = "divlist";

			let container = document.getElementById("target");

			container.insertBefore(element, container.firstChild);
		}

		function removeEveryOther() {
			let divListItems =
				document.getElementsByClassName("divlist");

			let length = divListItems.length;

			for (let i = 0; i < length; i += 2) {
				if (divListItems.length > 0) {
					divListItems[0].remove();
				}
			}
		}

		function shuffle() {
			let divListItems = document.getElementsByClassName("divlist");

			if (divListItems.length < 2) {
				return;
			}

			let first = Math.floor(Math.random() * divListItems.length);
			let second = Math.floor(Math.random() * divListItems.length);

			while (first == second) {
				second = Math.floor(Math.random() * divListItems.length);
			}

			let firstText = divListItems[first].innerHTML;
			let secondText = divListItems[second].innerHTML;

			divListItems[first].innerHTML = secondText;
			divListItems[second].innerHTML = firstText;
		}
	</script>

</body>

</html>
