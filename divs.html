<!DOCTYPE html>
<html>

<head>
	<title>Hana's Div List</title>

	<style>
		.flex-container {
			display: flex;
			flex-direction: row;
			background-color:red;
		}

		.flex-container>div {
			background-color: #f1f1f1;
			margin: 10px;
			padding: 20px;
			font-size: 30px;
		}

		/* Responsive layout */
		@media (max-width: 600px) {
			.flex-container {
				flex-direction: column;
				background-color: green;
			}
		}
	</style>
</head>

<body>

	<h1>Hana Tolera builds list with divs</h1>

	<input type="text" id="inputText">

	<div class="flex-container" id="target">
		<div class="divlist">row item 1</div>
		<div class="divlist">row item 2</div>
		<div class="divlist">row item 3</div>
	</div>

	<p>
		Press the button to create a new element of type div
		and then add it to the container.
	</p>

	<button onclick="makeNewDiv()">Add end</button>

	<script>
		function makeNewDiv() {
			let element = document.createElement("div");

			let inputValue = document.getElementById("inputText").value;

			element.innerHTML = inputValue;
			element.className = "divlist";

			let container = document.getElementById("target");
			container.appendChild(element);
		}
	</script>

</body>

</html>
